name: Build ldns

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-ldns.yml"
      - "bucket/ldns.json"

permissions:
  contents: write

jobs:
  build-win-msys2:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout bucket
        uses: actions/checkout@v5
        with:
          path: bucket

      - name: Checkout ldns
        uses: actions/checkout@v5
        with:
          repository: NLnetLabs/ldns
          path: ldns
          ref: 1.9.2
          fetch-depth: 0

      - name: Setup MSYS2
        id: setup-msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          cache: true
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-autotools
            mingw-w64-ucrt-x86_64-openssl

      - name: Build ldns
        working-directory: ldns
        run: |
          set -e

          sed -i \
            -e 's/test ! -h config\.h/test ! -L config.h/' \
            -e 's/test ! -h lib/test ! -L lib/' \
            -e 's/test ! -h include\/ldns/test ! -L include\/ldns/' \
            Makefile.in

          if test ! -f install-sh -a -f ../../install-sh; then cp ../../install-sh . ; fi
          libtoolize -ci
          autoreconf -fi
          ./configure \
            --prefix=/ \
            --with-examples \
            --with-ssl=/ucrt64 \
            --with-drill

          make -j"$(nproc)"

          rm -rf "$GITHUB_WORKSPACE/staging"
          #make V=1 DESTDIR="$GITHUB_WORKSPACE/staging" install

      - name: Setup upterm session
        if: failure()
        # uses: Warpbuilds/action-debugger@v1.3
        uses: owenthereal/action-upterm@v1
        with:
          msys2-location: ${{ steps.setup-msys2.outputs.msys2-location }}
