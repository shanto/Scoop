name: Build ldns

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-ldns.yml"
      - "bucket/ldns.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout bucket
        uses: actions/checkout@v5
        with:
          path: bucket

      - name: Checkout ldns
        uses: actions/checkout@v5
        with:
          repository: NLnetLabs/ldns
          path: ldns
          ref: develop
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-autotools
            mingw-w64-ucrt-x86_64-openssl

      - name: Build ldns
        working-directory: ldns
        run: |
          set -e

          if test ! -f install-sh -a -f ../../install-sh; then cp ../../install-sh . ; fi
          libtoolize -ci
          autoreconf -fi
          ./configure \
            --prefix=/usr \
            --with-ssl=/ucrt64 \
            --with-drill

          make -j"$(nproc)"

          rm -rf "$GITHUB_WORKSPACE/staging"

          make DESTDIR="$GITHUB_WORKSPACE/staging" install

      - name: Setup upterm session
        if: failure()
        uses: owenthereal/action-upterm@v1
